name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: formatted-source
          path: |
            crates/
            Cargo.lock
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release -p mailbench
      - run: python3 tests/cli_smoke.py target/release/mailbench
      - run: python3 tests/smtp_integration.py target/release/mailbench
      - uses: actions/upload-artifact@v4
        with:
          name: mailbench-${{ matrix.os }}
          path: target/release/mailbench
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/Mailbench.app dist/Mailbench-macos.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Mailbench-macos-app
          path: dist/Mailbench-macos.zip
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path macos
